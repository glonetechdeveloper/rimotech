<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business OS — Create your account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../public/css/global.css">
<link rel="stylesheet" href="../../public/css/components.css">
<link rel="stylesheet" href="../../public/css/pages/auth.css">
<link rel="stylesheet" href="../../public/css/ai-agent.css">
</head>
<body>

  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="auth-decor" aria-hidden="true">
    <svg class="decor-shape d1" style="top:9%;left:7%;width:44px;height:44px;" viewBox="0 0 44 44" fill="none">
      <circle cx="22" cy="22" r="18" stroke="#2F57FF" stroke-width="1.6" stroke-dasharray="4 5"/>
    </svg>
    <svg class="decor-shape d2" style="top:14%;right:9%;width:34px;height:34px;" viewBox="0 0 34 34" fill="none">
      <rect x="3" y="3" width="28" height="28" rx="6" stroke="#FFC53D" stroke-width="1.6" transform="rotate(12 17 17)"/>
    </svg>
    <svg class="decor-shape d3" style="bottom:12%;left:10%;width:30px;height:30px;" viewBox="0 0 30 30" fill="none">
      <path d="M15 3 L18 12 L27 15 L18 18 L15 27 L12 18 L3 15 L12 12 Z" stroke="#14182B" stroke-width="1.4"/>
    </svg>
    <svg class="decor-shape d4" style="bottom:18%;right:8%;width:26px;height:26px;" viewBox="0 0 26 26" fill="none">
      <circle cx="13" cy="13" r="10" stroke="#2F57FF" stroke-width="1.6"/>
    </svg>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-top">
        <a href="../index.html" class="brand">
          <img src="/assets/images/Rimotech_logo.png" alt="Rimotech logo">
          <span class="brand-mark"></span>
        </a>
      </div>

      <div class="auth-progress" aria-hidden="true">
        <span class="progress-tick" data-tick="1"></span>
        <span class="progress-tick" data-tick="2"></span>
      </div>

      <div id="stepStack">

        <div class="step active" data-step="1">
          <p class="badge">Create your account</p>
          <h1 class="step-title">Let's get you set up.</h1>
          <p class="step-sub">Just your email and a password to start.</p>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" class="text-input" placeholder="you@company.com" autocomplete="email">
            <p class="field-hint" id="emailHint"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" class="text-input" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="toggle-visibility" id="togglePw1" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="field-hint" id="pwHint">Use at least 8 characters.</p>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="password-wrap">
              <input type="password" id="confirm" class="text-input" placeholder="Re-enter your password" autocomplete="new-password">
              <button type="button" class="toggle-visibility" id="togglePw2" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="field-hint" id="confirmHint"></p>
          </div>

          <button class="btn-primary is-disabled" id="toStep2" style="margin-top:.5rem;">Continue</button>
          <p class="auth-footer-note">Already have an account? <a href="login.html">Log in</a></p>
        </div>

        <div class="step" data-step="2">
          <button class="btn-back" id="backBtn" style="margin-bottom:1rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Back
          </button>
          <p class="badge">One more thing</p>
          <h1 class="step-title">What best describes you?</h1>
          <p class="step-sub">This helps us tailor your workspace later.</p>

          <div class="choice-grid auth-choice-grid">
            <button class="choice-card" data-value="individual">
              <span class="choice-icon" data-icon="individual"></span>
              <span class="choice-title">Individual</span>
              <span class="choice-desc">Just me, working alone.</span>
            </button>
            <button class="choice-card" data-value="startup">
              <span class="choice-icon" data-icon="startup"></span>
              <span class="choice-title">Startup</span>
              <span class="choice-desc">Small, moving fast.</span>
            </button>
            <button class="choice-card" data-value="company">
              <span class="choice-icon" data-icon="company"></span>
              <span class="choice-title">Company</span>
              <span class="choice-desc">Established business.</span>
            </button>
            <button class="choice-card" data-value="enterprise">
              <span class="choice-icon" data-icon="enterprise"></span>
              <span class="choice-title">Enterprise</span>
              <span class="choice-desc">Large organization.</span>
            </button>
          </div>

          <a href="../onboarding/onboarding.html" class="btn-primary is-disabled" id="createBtn">Create account →</a>
        </div>

      </div>
    </div>
  </div>

  <script src="../../public/js/pages/auth.js"></script>
  <script src="../../public/js/ai-agent.js"></script>
</body>
</html>
